services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_accounting}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finance_accounting}?sslmode=disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Nightly pg_dump backup sidecar. Dumps are written to a named volume
  # with a 7-day retention (files older than 7 days are deleted by find).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-finance_accounting}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        while true; do
          echo "$$(date): starting backup"
          PGPASSWORD=$$POSTGRES_PASSWORD pg_dump \
            -h $$POSTGRES_HOST -U $$POSTGRES_USER $$POSTGRES_DB \
            --no-owner --clean --if-exists \
            | gzip > /backups/finance_$$(date +%Y%m%d_%H%M%S).sql.gz
          # Delete backups older than 7 days
          find /backups -name '*.sql.gz' -mtime +7 -delete
          echo "$$(date): backup complete, sleeping 24h"
          sleep 86400
        done
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backup_data:
