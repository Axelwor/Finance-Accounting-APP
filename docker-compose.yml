services:
  db:
    image: postgres:16-alpine
    container_name: finance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_secure_2026}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      nextreport:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://finance:${DB_PASSWORD:-changeme_secure_2026}@db:5432/finance?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-super_secure_jwt_secret_32chars_min_2026}"
      HTTP_ADDR: ":8080"
      STORAGE_ROOT: "/data/audit"
      NEXTREPORT_URL: "http://nextreport:3100"
    volumes:
      - audit_data:/data/audit
    expose:
      - "8080"

  nextreport:
    build:
      context: ./nextreport
      dockerfile: Dockerfile
    container_name: finance-nextreport
    restart: unless-stopped
    expose:
      - "3100"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: finance-web
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: finance-caddy
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  audit_data:
  caddy_data:
  caddy_config:
