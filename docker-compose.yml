version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: finance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_secure_2026}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://finance:${DB_PASSWORD:-changeme_secure_2026}@db:5432/finance?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-super_secure_jwt_secret_32chars_min_2026}"
      HTTP_ADDR: ":8080"
      STORAGE_ROOT: "/data/audit"
    volumes:
      - audit_data:/data/audit
    ports:
      - "127.0.0.1:8080:8080"

  nginx:
    image: nginx:alpine
    container_name: finance-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ["nginx"]

volumes:
  db_data:
  audit_data:
